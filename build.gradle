plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

// Agent/test builds must not rewrite the classes of an active IDE game.
if (project.hasProperty('isolatedBuild')) {
    layout.buildDirectory = layout.projectDirectory.dir('.gradle/isolated-build')
}

repositories {
    maven {
        url 'https://repo.redlance.org/public'
        content { includeGroup 'com.zigythebird.playeranim' }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    //geckolib
    implementation "curse.maven:geckolib-388172:8819017"

    // Optional Better Combat animation bridge; never bundle or require PAL.
    compileOnly('com.zigythebird.playeranim:PlayerAnimationLibCommon:1.2.5+mc.26.2') { transitive = false }
    compileOnly('com.zigythebird.playeranim:PlayerAnimationLibCore:1.2.5+mc.26.2') { transitive = false }

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // ModMenu — optional; provides the "Settings" button in the mods list HUD.
    compileOnly "curse.maven:modmenu-308702:8854488"

    // Jade (WAILA) — optional; 准星联动显示玩家/NPC/精英怪的境界等级，见 compat/jade。
    // compileOnly 仅参与编译，不进打包与运行时；玩家装了 Jade 才生效。
    compileOnly "maven.modrinth:jade:26.2.11+fabric"
}

processResources {
    from('examples/organ-pack') {
        into 'corpseorigin_examples/organ-pack'
    }
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName"}
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }

    repositories {
    }
}
