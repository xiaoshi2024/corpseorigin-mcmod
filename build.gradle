plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

if (project.hasProperty('chapterTests')) {
    apply from: 'tools/chapter-tests.gradle'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		url "https://cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	//geckolib
	implementation "curse.maven:geckolib-388172:8819017"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// ModMenu — optional; provides the "Settings" button in the mods list HUD.
	// Players without ModMenu installed can still open HUD settings via the F9 key.
	compileOnly "curse.maven:modmenu-308702:8854488"
}

processResources {
	from('examples/organ-pack') {
		into 'corpseorigin_examples/organ-pack'
	}
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

sourceSets {
    physicsTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('beeWheelPhysicsTest', JavaExec) {
    dependsOn physicsTestClasses
    classpath = sourceSets.physicsTest.runtimeClasspath
    mainClass = 'xiaoshi2022.corpseorigin.entity.BeeWheelPhysicsTest'
}

tasks.named('check') { dependsOn beeWheelPhysicsTest }

