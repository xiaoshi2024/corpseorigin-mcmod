sourceSets {
    renderTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
if (project.hasProperty('withPlayerAnimation')) {
    dependencies {
        renderTestRuntimeOnly('com.zigythebird.playeranim:PlayerAnimationLibFabric:1.2.5+mc.26.2') { transitive = false }
        renderTestRuntimeOnly('com.zigythebird.playeranim:PlayerAnimationLibCore:1.2.5+mc.26.2') { transitive = false }
    }
}
loom {
    mods {
        corpseorigin_render_test { sourceSet sourceSets.renderTest }
    }
    runs {
        renderTest {
            client()
            source sourceSets.renderTest
            runDir 'run/render-regression'
            vmArg '-Dcorpseorigin.renderRegression=true'
        }
    }
}
